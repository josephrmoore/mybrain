# Core Shell config
# Hand-edit this file to add silo-specific categories and settings.
# Modules read this through the shared config loader (config.py) —
# modules should never parse this file directly.

silos: {}

modules:
  - name: file_organizer
    silo: general
    handler_type: local
    handler_mechanism: python
    handler: file_organizer.organize_file
    claims:
      file_extension: [".pdf", ".doc", ".docx", ".txt", ".rtf", ".odt", ".pages", ".md", ".tex",
                        ".xls", ".xlsx", ".csv", ".numbers", ".ods",
                        ".ppt", ".pptx", ".key", ".odp",
                        ".jpg", ".jpeg", ".png", ".gif", ".bmp", ".tiff", ".tif", ".svg", ".webp", ".heic", ".raw", ".psd",
                        ".mp3", ".wav", ".aac", ".flac", ".m4a", ".ogg", ".wma", ".aiff",
                        ".mp4", ".mov", ".avi", ".mkv", ".wmv", ".flv", ".webm", ".m4v",
                        ".zip", ".rar", ".7z", ".tar", ".gz", ".dmg"]
      keyword: []
      folder: ["~/SORTTEST/inbox"]
      event: []
    rules:
      base_folder: "~/SORTTEST/sorted"
      needs_review_folder: "~/SORTTEST/needs_review"
      categories:
        - name: Documents
          extensions: [".pdf", ".doc", ".docx", ".txt", ".rtf", ".odt", ".pages", ".md", ".tex"]
        - name: Spreadsheets
          extensions: [".xls", ".xlsx", ".csv", ".numbers", ".ods"]
        - name: Presentations
          extensions: [".ppt", ".pptx", ".key", ".odp"]
        - name: Images
          extensions: [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".tiff", ".tif", ".svg", ".webp", ".heic", ".raw", ".psd"]
        - name: Audio
          extensions: [".mp3", ".wav", ".aac", ".flac", ".m4a", ".ogg", ".wma", ".aiff"]
        - name: Video
          extensions: [".mp4", ".mov", ".avi", ".mkv", ".wmv", ".flv", ".webm", ".m4v"]
        - name: Archives
          extensions: [".zip", ".rar", ".7z", ".tar", ".gz", ".dmg"]
